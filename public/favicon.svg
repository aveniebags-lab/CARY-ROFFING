<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F07020" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c27" />
      <stop offset="100%" stop-color="#0b1017" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#crBg)" stroke="#F07020" stroke-width="2"/>
  
  <!-- Roof Peak -->
  <polygon points="32,12 8,34 14,37 32,20 50,37 56,34" fill="url(#crGrad)" />
  
  <!-- Chimney Accent -->
  <rect x="42" y="18" width="6" height="10" fill="#F07020" rx="1" />

  <!-- Bold Monogram "CR" for CaryRoofing -->
  <text x="32" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    CR
  </text>
</svg>
