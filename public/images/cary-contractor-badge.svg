<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F07020" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Outer Gold/Orange Ring -->
  <circle cx="160" cy="160" r="150" fill="#1e2a3a" stroke="url(#badgeGold)" stroke-width="8" />
  <!-- Inner Dashed Ring -->
  <circle cx="160" cy="160" r="135" fill="none" stroke="#F07020" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Ribbon Tail -->
  <polygon points="120,240 160,285 200,240" fill="#F07020" />

  <!-- House Roof Peak & Stars -->
  <polygon points="160,85 105,135 115,142 160,103 205,142 215,135" fill="#F07020" />
  <circle cx="130" cy="70" r="4" fill="#f59e0b" />
  <circle cx="160" cy="62" r="5" fill="#f59e0b" />
  <circle cx="190" cy="70" r="4" fill="#f59e0b" />

  <!-- Badge Text -->
  <text x="160" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="1">
    CERTIFIED
  </text>
  <text x="160" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#F07020" letter-spacing="1.5">
    MASTER ROOFER
  </text>
  <text x="160" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">
    CARY, NC • NC LIC #82914
  </text>
</svg>
