<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Dark Radar GIS Map Texture -->
    <linearGradient id="gisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#141c27" />
    </linearGradient>

    <!-- Radar Pulse Ring -->
    <radialGradient id="hqPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F07020" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#F07020" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F07020" stop-opacity="0" />
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hudShadowMap" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- GIS Background -->
  <rect width="900" height="600" fill="url(#gisBg)" />

  <!-- Topographic / Street Grid Lines (Cary NC Major Arteries) -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.6">
    <!-- Latitude / Longitude Coordinate Grid -->
    <line x1="0" y1="120" x2="900" y2="120" stroke-dasharray="8,8" />
    <line x1="0" y1="240" x2="900" y2="240" stroke-dasharray="8,8" />
    <line x1="0" y1="360" x2="900" y2="360" stroke-dasharray="8,8" />
    <line x1="0" y1="480" x2="900" y2="480" stroke-dasharray="8,8" />
    
    <line x1="180" y1="0" x2="180" y2="600" stroke-dasharray="8,8" />
    <line x1="360" y1="0" x2="360" y2="600" stroke-dasharray="8,8" />
    <line x1="540" y1="0" x2="540" y2="600" stroke-dasharray="8,8" />
    <line x1="720" y1="0" x2="720" y2="600" stroke-dasharray="8,8" />
  </g>

  <!-- Major Highway Corridors: US-1, I-40, NC-54, NC-55, Cary Pkwy, Maynard Loop -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <!-- I-40 Trans-Wake Corridor -->
    <path d="M120 40 Q 400 90 850 160" stroke="#38bdf8" stroke-width="4" opacity="0.4" />
    <text x="680" y="130" font-family="'Courier New', monospace" font-size="10" font-weight="800" fill="#38bdf8">INTERSTATE 40</text>

    <!-- US-1 South Route -->
    <path d="M500 120 Q 640 300 720 580" stroke="#f59e0b" stroke-width="4" opacity="0.4" />
    <text x="730" y="440" font-family="'Courier New', monospace" font-size="10" font-weight="800" fill="#f59e0b">US HIGHWAY 1</text>

    <!-- Maynard Rd Inner Ring Loop -->
    <ellipse cx="480" cy="330" rx="140" ry="110" stroke="#475569" stroke-width="2.5" stroke-dasharray="10,5" />
    <text x="480" y="210" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">MAYNARD INNER LOOP</text>

    <!-- Cary Parkway Outer Ring -->
    <path d="M220 220 Q 420 160 740 260 Q 760 480 440 500 Q 240 460 220 220" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
    <text x="320" y="175" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#94a3b8">CARY PARKWAY NW</text>
  </g>

  <!-- ================= 5 ZIP CODE COVERAGE SECTORS ================= -->

  <!-- Sector 1: 27519 West Cary & Amberly -->
  <polygon points="60,220 280,140 330,300 160,390" fill="#ea580c" fill-opacity="0.18" stroke="#ea580c" stroke-width="2" />
  <!-- Marker 27519 -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="0" r="16" fill="#ea580c" filter="url(#glowEffect)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <rect x="-65" y="20" width="130" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#ea580c" stroke-width="1.5" />
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">ZIP 27519</text>
    <text x="0" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#fed7aa" text-anchor="middle">Amberly / Carpenter</text>
    <text x="0" y="58" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">35.8115°N, 78.8890°W</text>
  </g>

  <!-- Sector 2: 27513 North Cary & Preston -->
  <polygon points="280,140 580,100 620,280 330,300" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2" />
  <g transform="translate(440, 180)">
    <circle cx="0" cy="0" r="16" fill="#16a34a" filter="url(#glowEffect)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <rect x="-65" y="20" width="130" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#16a34a" stroke-width="1.5" />
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">ZIP 27513</text>
    <text x="0" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#bbf7d0" text-anchor="middle">North Cary / Preston</text>
    <text x="0" y="58" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">35.8010°N, 78.8051°W</text>
  </g>

  <!-- Sector 3: 27511 Central & Downtown Cary -->
  <polygon points="330,300 620,280 660,420 380,450" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2" />
  <g transform="translate(480, 340)">
    <circle cx="0" cy="0" r="16" fill="#2563eb" filter="url(#glowEffect)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <rect x="-65" y="20" width="130" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#2563eb" stroke-width="1.5" />
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">ZIP 27511</text>
    <text x="0" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#bfdbfe" text-anchor="middle">Downtown / Kildaire</text>
    <text x="0" y="58" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">35.7725°N, 78.7812°W</text>
  </g>

  <!-- Sector 4: 27512 East Cary & Crossroads -->
  <polygon points="620,280 840,240 880,420 660,420" fill="#9333ea" fill-opacity="0.18" stroke="#9333ea" stroke-width="2" />
  <g transform="translate(740, 310)">
    <circle cx="0" cy="0" r="16" fill="#9333ea" filter="url(#glowEffect)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <rect x="-65" y="20" width="130" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#9333ea" stroke-width="1.5" />
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">ZIP 27512</text>
    <text x="0" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#e9d5ff" text-anchor="middle">East / Crossroads</text>
    <text x="0" y="58" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">35.7850°N, 78.7500°W</text>
  </g>

  <!-- Sector 5: 27518 South Cary, Waverly Place & Lochmere (CENTRAL HQ) -->
  <polygon points="380,450 660,420 720,570 420,570" fill="#facc15" fill-opacity="0.2" stroke="#ca8a04" stroke-width="2" />
  
  <!-- DISPATCH HEADQUARTERS RADAR PULSE AT 580 NEW WAVERLY PL (27518) -->
  <g transform="translate(540, 470)">
    <!-- Radar Expanding Rings -->
    <circle cx="0" cy="0" r="65" fill="url(#hqPulse)">
      <animate attributeName="r" values="20;75;20" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="22" fill="#F07020" stroke="#ffffff" stroke-width="3" filter="url(#glowEffect)" />
    <polygon points="0,-12 8,6 -8,6" fill="#ffffff" />
    
    <!-- HQ Callout Box -->
    <g transform="translate(28, -25)" filter="url(#hudShadowMap)">
      <rect width="210" height="54" rx="8" fill="#0f172a" stroke="#F07020" stroke-width="2" />
      <text x="12" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff">
        ★ DISPATCH HQ: WAVERLY PLACE
      </text>
      <text x="12" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#fed7aa">
        580 New Waverly Pl Ste 216, Cary 27518
      </text>
      <text x="12" y="46" font-family="'Courier New', monospace" font-size="8" font-weight="800" fill="#38bdf8">
        GEO: 35.7368° N, -78.7832° W
      </text>
    </g>
  </g>

  <!-- ACTIVE ROOFING MOBILE DISPATCH FLEET UNITS ON MAP -->
  <g transform="translate(280, 260)">
    <circle cx="0" cy="0" r="7" fill="#1D9E75" stroke="#ffffff" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <rect x="10" y="-8" width="80" height="16" rx="4" fill="#0f172a" stroke="#1D9E75" stroke-width="1" />
    <text x="50" y="3" font-family="'Courier New', monospace" font-size="8" font-weight="800" fill="#1D9E75" text-anchor="middle">
      CREW #1 [ACTIVE]
    </text>
  </g>

  <g transform="translate(680, 220)">
    <circle cx="0" cy="0" r="7" fill="#1D9E75" stroke="#ffffff" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <rect x="10" y="-8" width="80" height="16" rx="4" fill="#0f172a" stroke="#1D9E75" stroke-width="1" />
    <text x="50" y="3" font-family="'Courier New', monospace" font-size="8" font-weight="800" fill="#1D9E75" text-anchor="middle">
      CREW #2 [ACTIVE]
    </text>
  </g>

  <!-- MAP TOP TELEMETRY HEADER -->
  <g transform="translate(20, 20)" filter="url(#hudShadowMap)">
    <rect width="460" height="74" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="#F07020" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff">
      CARY NC GIS ROOFING DISPATCH RADAR
    </text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">
      5 Wake County Postal Zones Covered: 27511, 27512, 27513, 27518, 27519
    </text>
    <text x="16" y="62" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#38bdf8">
      AVG ON-SITE ETA: 15-30 MIN | 24/7 RAPID EMERGENCY FLEET
    </text>
  </g>

  <!-- Map Legend -->
  <g transform="translate(20, 500)" filter="url(#hudShadowMap)">
    <rect width="260" height="75" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff">
      GIS MAP LEGEND
    </text>
    <circle cx="20" cy="35" r="5" fill="#F07020" />
    <text x="34" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">Central Dispatch Hub (Waverly Place)</text>
    <circle cx="20" cy="55" r="5" fill="#1D9E75" />
    <text x="34" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">Active Mobile Repair Units on Duty</text>
  </g>
</svg>
