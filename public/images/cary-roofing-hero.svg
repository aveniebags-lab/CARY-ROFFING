<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Sky & Atmosphere -->
    <linearGradient id="realisticSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="35%" stop-color="#7eb6f6" />
      <stop offset="65%" stop-color="#c5e0fc" />
      <stop offset="100%" stop-color="#f2f7fc" />
    </linearGradient>

    <!-- Cloud gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.3" />
    </linearGradient>

    <!-- Dimensional Architectural Shingle Gradients -->
    <linearGradient id="shingleFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4450" />
      <stop offset="50%" stop-color="#2d333e" />
      <stop offset="100%" stop-color="#1f232b" />
    </linearGradient>

    <linearGradient id="shingleShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111419" />
      <stop offset="100%" stop-color="#1c2027" />
    </linearGradient>

    <linearGradient id="deckPlywood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c28b49" />
      <stop offset="40%" stop-color="#b07b3b" />
      <stop offset="70%" stop-color="#c99557" />
      <stop offset="100%" stop-color="#9d6b2f" />
    </linearGradient>

    <linearGradient id="syntheticBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Metal Flashing Specular -->
    <linearGradient id="metalFlashing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- High-Vis Vest Orange -->
    <linearGradient id="hiVisOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="100%" stop-color="#e05300" />
    </linearGradient>

    <!-- Jobsite Camera HUD Filter -->
    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1000" height="620" fill="url(#realisticSky)" />

  <!-- Natural Carolina Cumulus Clouds -->
  <path d="M-50 140 Q 60 80 160 110 Q 240 70 340 100 Q 420 120 460 150 Q 200 170 -50 160 Z" fill="url(#cloudGrad)" />
  <path d="M520 120 Q 640 60 760 90 Q 840 50 940 80 Q 1040 110 1080 150 Q 800 160 520 140 Z" fill="url(#cloudGrad)" />

  <!-- Distant Cary Pine & Oak Tree Canopy (Wake County Foliage) -->
  <path d="M-20 380 Q 40 280 100 340 Q 160 270 240 330 Q 320 290 400 350 L400 480 L-20 480 Z" fill="#1b4332" opacity="0.4" />
  <path d="M680 360 Q 760 270 840 320 Q 920 280 1020 340 L1020 480 L680 480 Z" fill="#1b4332" opacity="0.4" />
  <path d="M0 400 Q 80 320 160 370 Q 240 310 320 380 L320 520 L0 520 Z" fill="#0d2818" opacity="0.65" />
  <path d="M720 390 Q 820 310 920 360 Q 980 330 1040 390 L1040 520 L720 520 Z" fill="#0d2818" opacity="0.65" />

  <!-- NEIGHBOR HOUSE GABLE (DEPTH PERSPECTIVE) -->
  <polygon points="780,440 920,320 1040,440" fill="#334155" stroke="#1e293b" stroke-width="2" />
  <polygon points="790,440 920,330 1030,440" fill="#1e293b" opacity="0.8" />

  <!-- MAIN ROOF PLANE (FIELD PHOTOGRAPHY ANGLE - 35° PITCH) -->
  <!-- Exposed Plywood Decking (Tear-off section on left) -->
  <polygon points="0,480 340,160 500,160 160,540" fill="url(#deckPlywood)" />
  <!-- Plywood Sheet Seams & H-Clips -->
  <line x1="100" y1="380" x2="380" y2="160" stroke="#78350f" stroke-width="2" stroke-dasharray="120,4" />
  <line x1="40" y1="520" x2="260" y2="340" stroke="#78350f" stroke-width="2" />
  <circle cx="210" cy="275" r="3" fill="#cbd5e1" />
  <circle cx="290" cy="210" r="3" fill="#cbd5e1" />

  <!-- Blue Synthetic Underlayment Roll (Overlap Mid-Section) -->
  <polygon points="140,540 480,160 620,160 280,560" fill="url(#syntheticBlue)" />
  <!-- Grid Lines on Underlayment -->
  <line x1="220" y1="460" x2="520" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,8" />
  <line x1="260" y1="480" x2="560" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,8" />
  <text x="360" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff" opacity="0.8" transform="rotate(-40 360 320)">
    WAKE COUNTY CODE COMPLIANT SYNTHETIC SHIELD
  </text>

  <!-- New Dimensional Architectural Shingle Courses (Right Field) -->
  <!-- Layer 1 (Bottom Course) -->
  <polygon points="260,560 600,160 1020,440 820,620" fill="url(#shingleShadow)" />
  
  <!-- Shingle Course Bands with Dimensional Shadowing -->
  <g fill="url(#shingleFace)" stroke="#111419" stroke-width="1">
    <!-- Course 1 -->
    <polygon points="340,560 630,220 980,450 780,620" />
    <line x1="440" y1="530" x2="480" y2="580" stroke="#000" stroke-width="3" />
    <line x1="580" y1="440" x2="620" y2="490" stroke="#000" stroke-width="3" />
    <line x1="720" y1="350" x2="760" y2="400" stroke="#000" stroke-width="3" />

    <!-- Course 2 -->
    <polygon points="380,520 650,200 950,400 740,570" />
    <line x1="480" y1="490" x2="520" y2="540" stroke="#000" stroke-width="3" />
    <line x1="620" y1="400" x2="660" y2="450" stroke="#000" stroke-width="3" />
    <line x1="760" y1="310" x2="800" y2="360" stroke="#000" stroke-width="3" />

    <!-- Course 3 -->
    <polygon points="420,480 670,180 920,350 700,520" />
    <line x1="520" y1="450" x2="560" y2="500" stroke="#000" stroke-width="3" />
    <line x1="660" y1="360" x2="700" y2="410" stroke="#000" stroke-width="3" />

    <!-- Course 4 (Near Ridge) -->
    <polygon points="460,440 690,160 890,300 660,470" />
  </g>

  <!-- Blue Chalk Snap Line for Shingle Straightness -->
  <line x1="390" y1="510" x2="880" y2="360" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,2" />

  <!-- BRICK CHIMNEY WITH COUNTER-FLASHING IN PROGRESS -->
  <g transform="translate(680, 110)">
    <!-- Chimney Body (Red Brick Texture) -->
    <rect x="0" y="0" width="110" height="150" fill="#7f1d1d" stroke="#450a0a" stroke-width="2" />
    <line x1="0" y1="30" x2="110" y2="30" stroke="#991b1b" stroke-width="2" stroke-dasharray="15,3" />
    <line x1="0" y1="60" x2="110" y2="60" stroke="#991b1b" stroke-width="2" stroke-dasharray="15,3" />
    <line x1="0" y1="90" x2="110" y2="90" stroke="#991b1b" stroke-width="2" stroke-dasharray="15,3" />
    <!-- Concrete Crown & Spark Cap -->
    <rect x="-8" y="-12" width="126" height="14" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <rect x="25" y="-35" width="60" height="24" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
    <!-- Fresh Metal Step Flashing & Reglet Cut Counter-Flashing -->
    <polygon points="-5,120 115,120 118,145 -5,145" fill="url(#metalFlashing)" stroke="#334155" stroke-width="1" />
    <line x1="-5" y1="120" x2="115" y2="120" stroke="#0f172a" stroke-width="3" />
    <!-- Lead Wedges in Mortar -->
    <circle cx="20" cy="120" r="3" fill="#64748b" />
    <circle cx="55" cy="120" r="3" fill="#64748b" />
    <circle cx="90" cy="120" r="3" fill="#64748b" />
  </g>

  <!-- LIVE FIELD ROOFER AT WORK (REALISTIC SAFETY GEAR & NAIL GUN) -->
  <g transform="translate(390, 240)">
    <!-- Safety Harness Rope running up to ridge anchor -->
    <line x1="80" y1="10" x2="220" y2="-90" stroke="#ef4444" stroke-width="4" />
    <circle cx="220" cy="-90" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />

    <!-- Roofer Silhouette & Workwear -->
    <!-- Hardhat -->
    <ellipse cx="65" cy="15" rx="22" ry="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <rect x="43" y="24" width="44" height="4" rx="2" fill="#eab308" />

    <!-- Torso in High-Visibility Safety Vest with Reflective Strips -->
    <path d="M42 32 L88 32 L94 105 L36 105 Z" fill="url(#hiVisOrange)" stroke="#c2410c" stroke-width="2" />
    <!-- Silver 3M Reflective Safety Strips -->
    <rect x="44" y="45" width="42" height="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="56" y1="32" x2="54" y2="105" stroke="#f8fafc" stroke-width="7" />
    <line x1="74" y1="32" x2="76" y2="105" stroke="#f8fafc" stroke-width="7" />

    <!-- Tool Belt with Nail Pouches & Hammer Holster -->
    <rect x="34" y="102" width="62" height="15" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <rect x="36" y="117" width="22" height="26" rx="4" fill="#92400e" />
    <rect x="70" y="117" width="24" height="26" rx="4" fill="#92400e" />

    <!-- Work Pants (Heavy Duty Carhartt Duck Canvas) -->
    <path d="M40 115 L62 115 L65 190 L45 190 Z" fill="#3b4252" />
    <path d="M68 115 L90 115 L105 180 L88 185 Z" fill="#2e3440" />
    <!-- Steel-Toe Work Boots -->
    <rect x="42" y="188" width="28" height="15" rx="5" fill="#78350f" stroke="#000" stroke-width="1.5" />
    <rect x="88" y="180" width="30" height="15" rx="5" fill="#78350f" stroke="#000" stroke-width="1.5" />

    <!-- Roofer Arms & Hands holding Pneumatic Coil Nailer -->
    <!-- Arm reaching forward -->
    <path d="M88 45 L135 75 L125 90 L85 65 Z" fill="#ea580c" />
    <!-- Pneumatic Coil Roofing Nail Gun (Bostitch / DeWalt Profile) -->
    <g transform="translate(130, 70)">
      <rect x="0" y="10" width="28" height="14" rx="3" fill="#1e293b" />
      <circle cx="28" cy="22" r="16" fill="#334155" stroke="#1e293b" stroke-width="2" />
      <rect x="18" y="2" width="26" height="8" fill="#eab308" />
      <line x1="38" y1="6" x2="52" y2="6" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <!-- Air Hose (Yellow polyurethane coiled hose trailing back) -->
      <path d="M5 24 Q -20 60 -10 110 Q 0 160 -40 220" stroke="#facc15" stroke-width="4" fill="none" stroke-linecap="round" />
    </g>

    <!-- Bundle of Architectural Shingles on Roof Deck -->
    <g transform="translate(170, 160)">
      <rect x="0" y="0" width="90" height="22" rx="3" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
      <rect x="4" y="3" width="82" height="5" fill="#334155" />
      <text x="45" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">
        GAF TIMBERLINE HDZ
      </text>
    </g>
  </g>

  <!-- FOREGROUND RIDGE VENT & FLASHING DETAILS -->
  <polygon points="500,160 700,160 700,172 500,172" fill="#0f172a" />
  <line x1="500" y1="166" x2="700" y2="166" stroke="#F07020" stroke-width="2" stroke-dasharray="6,4" />

  <!-- REALISTIC CONTRACTOR FIELD SNAPSHOT HUD OVERLAY (COMPANYCAM / EAGLEVIEW TELEMETRY) -->
  <g transform="translate(24, 24)" filter="url(#hudShadow)">
    <!-- Telemetry Box Background -->
    <rect width="420" height="106" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#F07020" stroke-width="1.5" />
    
    <!-- Header with Live Recording Dot -->
    <circle cx="20" cy="22" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      JOB SITE PHOTO AUDIT • CARY NC DISPATCH
    </text>
    <rect x="330" y="14" width="76" height="18" rx="4" fill="#1D9E75" />
    <text x="368" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">
      ACTIVE PROOF
    </text>

    <!-- Geographic & Code Metadata Lines -->
    <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
      <tspan font-weight="800" fill="#F07020">ADDRESS:</tspan> 580 New Waverly Pl Ste 216, Cary, NC 27518
    </text>
    <text x="16" y="68" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      GEO: 35.7368° N, -78.7832° W • ELEV: 418 FT • ACC: ±1.2m
    </text>
    <text x="16" y="88" font-family="'Courier New', monospace" font-size="10" font-weight="600" fill="#94a3b8">
      DATE: OCT 14, 2026 | AZIMUTH: 142° SE | PITCH: 7:12 | ZONE 4A
    </text>
  </g>

  <!-- BOTTOM RIGHT QUALITY VERIFICATION WATERMARK STAMP -->
  <g transform="translate(680, 500)" filter="url(#hudShadow)">
    <rect width="295" height="95" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#1D9E75" stroke-width="2" />
    <!-- Certified Master Roofer Icon -->
    <circle cx="45" cy="48" r="26" fill="#1D9E75" />
    <path d="M33 48 L41 56 L58 38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="82" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      WAKE COUNTY FIELD VERIFIED
    </text>
    <text x="82" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
      6-Nail Fastener Uplift Pattern Passed
    </text>
    <text x="82" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F07020">
      NC LIC #82914 • HAAG CERTIFIED
    </text>
  </g>

  <!-- Crosshair Focus Reticle (Simulating Camera Screen Shot Viewfinder) -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.6" fill="none">
    <line x1="500" y1="280" x2="500" y2="300" />
    <line x1="500" y1="320" x2="500" y2="340" />
    <line x1="470" y1="310" x2="490" y2="310" />
    <line x1="510" y1="310" x2="530" y2="310" />
    <circle cx="500" cy="310" r="18" stroke-dasharray="4,4" />
  </g>
</svg>
