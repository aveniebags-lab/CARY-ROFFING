<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <!-- Thermal FLIR Palette Gradient for Roof Surface -->
    <linearGradient id="thermalRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="25%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="75%" stop-color="#d946ef" />
      <stop offset="90%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Normal Color Roof Underlay -->
    <linearGradient id="roofBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="hudShadowInsp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- AERIAL ROOFTOP HIGH-RESOLUTION VIEW (DRONE GIMBAL PERSPECTIVE) -->
  <rect width="900" height="560" fill="url(#roofBase)" />

  <!-- Roof Hip and Valley Lines (High-Altitude Perspective) -->
  <polygon points="100,560 450,140 800,560" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
  <polygon points="450,140 800,560 900,450 650,80" fill="#334155" stroke="#0f172a" stroke-width="2" />
  <polygon points="100,560 450,140 320,60 0,420" fill="#2d3748" stroke="#0f172a" stroke-width="2" />

  <!-- Ridge line highlight -->
  <line x1="320" y1="60" x2="650" y2="80" stroke="#cbd5e1" stroke-width="3" />
  <line x1="450" y1="140" x2="800" y2="560" stroke="#475569" stroke-width="2" />
  <line x1="450" y1="140" x2="100" y2="560" stroke="#475569" stroke-width="2" />

  <!-- FLIR RADIOMETRIC THERMAL SCANNING WINDOW (ACTIVE INFRARED PROBE OVER VALLEY) -->
  <g transform="translate(360, 240)">
    <polygon points="-80,180 80,-40 220,-40 60,180" fill="url(#thermalRoof)" opacity="0.82" stroke="#38bdf8" stroke-width="2" />
    <text x="30" y="70" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#ffffff">
      THERMAL DELTA: 104.2°F (MOISTURE ANOMALY TRACED)
    </text>
  </g>

  <!-- CHALK-MARKED 10X10 HAIL DAMAGE TEST SQUARE (HAAG CERTIFIED METHODOLOGY) -->
  <g transform="translate(180, 280)">
    <!-- White Chalk Square -->
    <rect x="0" y="0" width="130" height="130" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="12,6" />
    <text x="65" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
      10'x10' TEST SQUARE
    </text>

    <!-- Chalked Hail Hits (Circles with impact point) -->
    <circle cx="35" cy="50" r="10" stroke="#facc15" stroke-width="2" fill="#ef4444" fill-opacity="0.4" />
    <circle cx="35" cy="50" r="3" fill="#ffffff" />
    
    <circle cx="85" cy="45" r="12" stroke="#facc15" stroke-width="2" fill="#ef4444" fill-opacity="0.4" />
    <circle cx="85" cy="45" r="3" fill="#ffffff" />
    
    <circle cx="45" cy="95" r="11" stroke="#facc15" stroke-width="2" fill="#ef4444" fill-opacity="0.4" />
    <circle cx="45" cy="95" r="3" fill="#ffffff" />
    
    <circle cx="95" cy="90" r="9" stroke="#facc15" stroke-width="2" fill="#ef4444" fill-opacity="0.4" />
    <circle cx="95" cy="90" r="3" fill="#ffffff" />

    <text x="65" y="122" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#facc15" text-anchor="middle">
      HAIL HITS: 8/SQ (INSURANCE PASS)
    </text>
  </g>

  <!-- DRONE FLIGHT TELEMETRY HUD OVERLAYS (FLIGHT RECORDING SCREENSHOT) -->
  <!-- Center Flight Crosshair Target -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.85">
    <circle cx="450" cy="280" r="45" stroke-dasharray="8,6" />
    <line x1="450" y1="220" x2="450" y2="250" />
    <line x1="450" y1="310" x2="450" y2="340" />
    <line x1="390" y1="280" x2="420" y2="280" />
    <line x1="480" y1="280" x2="510" y2="280" />
    <circle cx="450" cy="280" r="4" fill="#38bdf8" />
  </g>

  <!-- Drone Top Flight Bar -->
  <g transform="translate(300, 20)" filter="url(#hudShadowInsp)">
    <rect width="300" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">
      DRONE 4K FLIGHT | ALT: 38FT AGL | SAT: 19
    </text>
  </g>

  <!-- Thermal Scale Bar (Right Edge) -->
  <g transform="translate(840, 160)" filter="url(#hudShadowInsp)">
    <rect width="36" height="200" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="20" width="12" height="160" fill="url(#thermalRoof)" rx="2" />
    <text x="22" y="28" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#fef08a">118°F</text>
    <text x="22" y="105" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#d946ef">95°F</text>
    <text x="22" y="178" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#38bdf8">74°F</text>
  </g>

  <!-- CONTRACTOR CAMERA HUD & GEOTAG OVERLAY -->
  <g transform="translate(20, 20)" filter="url(#hudShadowInsp)">
    <rect width="450" height="106" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#F07020" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff">
      AERIAL DRONE AUDIT • 21-POINT CERTIFICATION
    </text>
    <rect x="360" y="14" width="76" height="18" rx="4" fill="#1D9E75" />
    <text x="398" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">
      PASS
    </text>
    <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
      <tspan font-weight="800" fill="#F07020">LOCATION:</tspan> Park West Village, North Cary, NC 27513
    </text>
    <text x="16" y="68" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      GEO: 35.8010° N, -78.8051° W • SENSOR: 4K Radiometric FLIR
    </text>
    <text x="16" y="88" font-family="'Courier New', monospace" font-size="10" font-weight="600" fill="#94a3b8">
      AUDIT ID: NC-INSP-27513 | HAAG CERTIFIED TEST SQUARE COMPLETE
    </text>
  </g>

  <!-- Inspection Report Summary Badge -->
  <g transform="translate(560, 440)" filter="url(#hudShadowInsp)">
    <rect width="310" height="95" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1D9E75" stroke-width="2" />
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      21-POINT ROOF AUDIT REPORT
    </text>
    <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
      Timestamped Drone Photo Package
    </text>
    <text x="20" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F07020">
      Adjuster-Ready Xactimate Documentation
    </text>
  </g>
</svg>
