<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <!-- Aluminum Gutter Sheen -->
    <linearGradient id="aluminumSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Mobile Box Truck Body -->
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="hudShadowGut" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Jobsite Driveway & Daylight -->
  <rect width="900" height="560" fill="#f1f5f9" />
  <!-- Asphalt Driveway Base -->
  <polygon points="0,380 900,320 900,560 0,560" fill="#334155" />
  <line x1="0" y1="460" x2="900" y2="400" stroke="#475569" stroke-width="2" stroke-dasharray="25,15" />

  <!-- MOBILE SEAMLESS GUTTER FACTORY TRUCK (CURBSIDE ROLL-FORMING) -->
  <g transform="translate(40, 160)">
    <!-- Truck Box Body -->
    <rect x="0" y="0" width="280" height="180" rx="6" fill="url(#truckBody)" stroke="#0f172a" stroke-width="2" />
    <!-- Rear Roll-Up Door Open -->
    <rect x="200" y="20" width="70" height="150" fill="#0f172a" />
    
    <!-- Cary Roofing Fleet Graphics on Truck -->
    <text x="100" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#ffffff">
      caryncroofing<tspan fill="#F07020">.</tspan>
    </text>
    <text x="100" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#F07020">
      MOBILE SEAMLESS FACTORY
    </text>
    <text x="100" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">
      Custom .032" Aluminum On-Site
    </text>
    <text x="100" y="125" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#38bdf8">
      DISPATCH: (919) 335-9543
    </text>

    <!-- Wheels -->
    <circle cx="80" cy="190" r="28" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="80" cy="190" r="12" fill="#64748b" />
    <circle cx="220" cy="190" r="28" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="220" cy="190" r="12" fill="#64748b" />
  </g>

  <!-- SEAMLESS ROLL-FORMING MACHINE EXTRUDING 6-INCH GUTTER -->
  <g transform="translate(260, 260)">
    <!-- Metal Extrusion Mouth of Machine Inside Truck -->
    <rect x="0" y="0" width="35" height="40" fill="#eab308" stroke="#a16207" stroke-width="2" />

    <!-- Continuous 50-Foot Single Seamless K-Style Gutter Run Spanning Right -->
    <polygon points="35,15 620,15 620,55 35,55" fill="url(#aluminumSheen)" stroke="#475569" stroke-width="1.5" />
    <!-- Gutter Profile Lip Line -->
    <line x1="35" y1="20" x2="620" y2="20" stroke="#f8fafc" stroke-width="2" />
    <line x1="35" y1="40" x2="620" y2="40" stroke="#334155" stroke-width="1.5" />
    
    <!-- Hidden Screw Hangers Inserted every 24 inches -->
    <g fill="#1e293b" stroke="#f8fafc" stroke-width="1">
      <rect x="120" y="14" width="8" height="42" rx="2" />
      <circle cx="124" cy="22" r="2" fill="#F07020" />
      <rect x="260" y="14" width="8" height="42" rx="2" />
      <circle cx="264" cy="22" r="2" fill="#F07020" />
      <rect x="400" y="14" width="8" height="42" rx="2" />
      <circle cx="404" cy="22" r="2" fill="#F07020" />
      <rect x="540" y="14" width="8" height="42" rx="2" />
      <circle cx="544" cy="22" r="2" fill="#F07020" />
    </g>

    <!-- Stainless Steel Micro-Mesh Gutter Guard Top Section -->
    <line x1="35" y1="14" x2="620" y2="14" stroke="#F07020" stroke-width="3" stroke-dasharray="3,2" />
    <text x="320" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#F07020" text-anchor="middle">
      SURGICAL STAINLESS STEEL MICRO-MESH GUARD INSERT
    </text>
  </g>

  <!-- TECHNICIAN HOLDING RUN WITH DIGITAL TORPEDO LEVEL (SLOPE CHECK) -->
  <g transform="translate(640, 220)">
    <!-- Yellow Hardhat -->
    <ellipse cx="40" cy="20" rx="18" ry="11" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <!-- High-Vis Vest -->
    <path d="M22 32 L58 32 L64 88 L18 88 Z" fill="#F07020" stroke="#c2410c" stroke-width="1.5" />
    <rect x="25" y="48" width="34" height="6" fill="#ffffff" />
    <!-- Hands Supporting Gutter Run -->
    <path d="M58 45 L90 60 L80 75 L50 55 Z" fill="#ea580c" />
    <rect x="80" y="55" width="16" height="20" rx="3" fill="#334155" />

    <!-- Digital Magnetic Torpedo Level on Gutter Rim -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="70" height="15" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="35" cy="7" r="4" fill="#22c55e" />
      <!-- Digital Pitch Display: 1/4" / 10ft -->
      <text x="35" y="-3" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#15803d" text-anchor="middle">
        SLOPE: 1/4" PER 10FT [PASSED]
      </text>
    </g>
  </g>

  <!-- CONTRACTOR CAMERA HUD & GEOTAG OVERLAY -->
  <g transform="translate(20, 20)" filter="url(#hudShadowGut)">
    <rect width="450" height="106" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#F07020" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff">
      MOBILE FABRICATION AUDIT • 6" SEAMLESS GUTTERS
    </text>
    <rect x="360" y="14" width="76" height="18" rx="4" fill="#1D9E75" />
    <text x="398" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">
      ROLL-FORM
    </text>
    <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
      <tspan font-weight="800" fill="#F07020">LOCATION:</tspan> 580 New Waverly Pl, South Cary, NC 27518
    </text>
    <text x="16" y="68" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      GEO: 35.7368° N, -78.7832° W • RUN LENGTH: 56 FT UNBROKEN
    </text>
    <text x="16" y="88" font-family="'Courier New', monospace" font-size="10" font-weight="600" fill="#94a3b8">
      SPEC: .032" Heavy Aluminum | Oversized 3x4" Downspouts
    </text>
  </g>

  <!-- Bottom Quality Stamp -->
  <g transform="translate(580, 440)" filter="url(#hudShadowGut)">
    <rect width="290" height="90" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1D9E75" stroke-width="2" />
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      CUSTOM SEAMLESS GUTTERS
    </text>
    <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
      Zero Seams • Zero Joint Leaks
    </text>
    <text x="20" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F07020">
      Lifetime Clog-Free Micro-Mesh
    </text>
  </g>
</svg>
