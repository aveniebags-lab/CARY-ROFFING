<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <!-- Commercial Roof White TPO Membrane Gradient -->
    <linearGradient id="tpoMembrane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Parapet Wall Concrete / Metal Cap -->
    <linearGradient id="copingMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="hudShadowFlat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Clear Carolina Sky Above Commercial Deck -->
  <rect width="900" height="560" fill="#38bdf8" />
  
  <!-- COMMERCIAL FLAT ROOF PERSPECTIVE -->
  <!-- Parapet Wall along Top-Left Edge -->
  <polygon points="0,260 280,100 280,75 0,230" fill="url(#copingMetal)" stroke="#0f172a" stroke-width="2" />
  <polygon points="280,100 900,100 900,75 280,75" fill="url(#copingMetal)" stroke="#0f172a" stroke-width="2" />

  <!-- Flat TPO White Membrane Field Deck -->
  <polygon points="0,260 280,100 900,100 900,560 0,560" fill="url(#tpoMembrane)" stroke="#94a3b8" stroke-width="2" />

  <!-- Welded Seam Lines with Seam Weld Overlap -->
  <line x1="120" y1="560" x2="420" y2="100" stroke="#F07020" stroke-width="3" />
  <line x1="360" y1="560" x2="660" y2="100" stroke="#F07020" stroke-width="3" />
  <line x1="600" y1="560" x2="900" y2="100" stroke="#F07020" stroke-width="3" />

  <!-- LEISTER AUTOMATED ROBOTIC HOT-AIR SEAM WELDER (1,000°F FUSION) -->
  <g transform="translate(320, 240)">
    <!-- Welder Chassis (Industrial Red/Steel) -->
    <rect x="0" y="0" width="80" height="42" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <rect x="8" y="6" width="30" height="15" rx="2" fill="#1e293b" />
    <!-- Digital Heat Display: 1000°F -->
    <text x="23" y="17" font-family="'Courier New', monospace" font-size="8" font-weight="900" fill="#22c55e" text-anchor="middle">
      1000°F
    </text>
    <!-- Heavy-Duty Brass Pressure Rollers -->
    <circle cx="16" cy="42" r="14" fill="#d97706" stroke="#451a03" stroke-width="2" />
    <circle cx="64" cy="42" r="14" fill="#d97706" stroke="#451a03" stroke-width="2" />
    <!-- Hot-air Blower Nozzle under lap -->
    <polygon points="40,28 35,42 45,42" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Power Cord Trailing -->
    <path d="M75 15 Q 120 20 140 60 Q 160 100 200 120" stroke="#facc15" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Technician Hand Steering Handle -->
    <line x1="65" y1="0" x2="110" y2="-60" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <circle cx="112" cy="-62" r="8" fill="#1e293b" />
  </g>

  <!-- ROOFTOP COMMERCIAL HVAC ROOFTOP UNIT (RTU) WITH WELDED CURB FLASHING -->
  <g transform="translate(560, 140)">
    <!-- Steel HVAC Enclosure -->
    <rect x="0" y="0" width="160" height="90" rx="4" fill="#64748b" stroke="#334155" stroke-width="2" />
    <line x1="20" y1="20" x2="140" y2="20" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="35" x2="140" y2="35" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="50" x2="140" y2="50" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <!-- Fan Cowl -->
    <circle cx="80" cy="70" r="14" fill="#334155" />
    <circle cx="80" cy="70" r="5" fill="#f59e0b" />
    <!-- Welded TPO Flashing Curb around Base -->
    <rect x="-10" y="80" width="180" height="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Heat-Welded Corner Flashing Corners -->
    <circle cx="-5" cy="90" r="5" fill="#F07020" />
    <circle cx="165" cy="90" r="5" fill="#F07020" />
    <text x="80" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0f172a" text-anchor="middle">
      FACTORY PRE-FAB TPO CURB
    </text>
  </g>

  <!-- INTERNAL ROOF DRAIN BASKET & CLAMPING RING -->
  <g transform="translate(180, 410)">
    <circle cx="40" cy="40" r="32" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="2" />
    <circle cx="40" cy="40" r="18" fill="#1e293b" />
    <circle cx="40" cy="40" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,2" />
    <text x="40" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0369a1" text-anchor="middle">
      CAST-IRON DRAIN SUMP
    </text>
  </g>

  <!-- CONTRACTOR CAMERA HUD & GEOTAG OVERLAY -->
  <g transform="translate(20, 20)" filter="url(#hudShadowFlat)">
    <rect width="450" height="106" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#F07020" stroke-width="1.5" />
    <circle cx="20" cy="22" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff">
      COMMERCIAL JOB SITE • 60-MIL TPO ROBOTIC WELD
    </text>
    <rect x="360" y="14" width="76" height="18" rx="4" fill="#1D9E75" />
    <text x="398" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">
      NDL 20-YR
    </text>
    <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
      <tspan font-weight="800" fill="#F07020">LOCATION:</tspan> Crossroads Commercial Corridor, Cary 27512
    </text>
    <text x="16" y="68" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      GEO: 35.7850° N, -78.7500° W • TEMP: 1000°F HOT AIR FUSED
    </text>
    <text x="16" y="88" font-family="'Courier New', monospace" font-size="10" font-weight="600" fill="#94a3b8">
      CARLISLE SYNTEC CERTIFIED | 100% BLUNT PROBE SEAM VERIFIED
    </text>
  </g>

  <!-- Bottom Manufacturer Warranty Stamp -->
  <g transform="translate(580, 440)" filter="url(#hudShadowFlat)">
    <rect width="290" height="90" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1D9E75" stroke-width="2" />
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      COMMERCIAL FLAT ROOFING
    </text>
    <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
      TPO, PVC, EPDM Single-Ply
    </text>
    <text x="20" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F07020">
      Zero-Downtime Facility Guarantee
    </text>
  </g>
</svg>
